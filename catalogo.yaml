areas:
  gestao:
    plugin: tess-gestao
    titulo: TESS Gestão e Finanças
    descricao: Perfil da empresa, diretor financeiro, plano de receita, gestão, processos, reforma tributária, modelo de negócio e assinatura.
  comercial:
    plugin: tess-comercial
    titulo: TESS Comercial e Cliente
    descricao: Diretor comercial, agente de vendas, calendário comercial, experiência do cliente, aquisição, concorrentes e raio-x do site.
  gente:
    plugin: tess-gente
    titulo: TESS Gente
    descricao: Diretora de gente — cargos, contratação, custo de pessoal, avaliação e conversas de alinhamento.
  ia:
    plugin: tess-ia
    titulo: TESS IA no Negócio
    descricao: Head de IA, serviços com IA, negócio eficiente, construtor de IA, engenheiro de prompt e agente de qualidade.
  marketing:
    plugin: tess-marketing
    titulo: TESS Marketing e Conteúdo
    descricao: Engenharia de marketing, ferramenta de marketing, marketing educativo, temas, ganchos, carrosséis e vídeos curtos.

