# Catálogo do Sistema IA TESS — dono único da lista de skills, áreas e pacotes.
# `.claude-plugin/marketplace.json` é gerado daqui por `make marketplace`; não editar à mão.

marketplace:
  nome: sistema-ia-tess
  dono: TESS Contabilidade Estratégica
  descricao: Sistema IA TESS — skills de gestão, finanças, comercial, IA e marketing da TESS Contabilidade Estratégica para o empresário usar no Claude.
